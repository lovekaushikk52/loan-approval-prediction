<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Approval Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="main">
        <h1>Loan Approval Prediction</h1>
        <form action="/predict" method="POST">

    <label>Gender</label>
    <select name="Gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>

    <label>Married</label>
    <select name="Married" required>
        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select>

    <label>Dependents</label>
    <select name="Dependents" required>
        <option value="">Select</option>
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3+">3+</option>
    </select>

    <label>Education</label>
    <select name="Education" required>
        <option value="">Select</option>
        <option value="Graduate">Graduate</option>
        <option value="Not Graduate">Not Graduate</option>
    </select>

    <label>Self Employed</label>
    <select name="Self_Employed" required>
        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select>

    <label>Applicant Income</label>
    <input type="number" name="ApplicantIncome" required>

    <label>Coapplicant Income</label>
    <input type="number" name="CoapplicantIncome" required>

    <label>Loan Amount</label>
    <input type="number" name="LoanAmount" required>

    <label>Loan Amount Term</label>
    <input type="number" name="Loan_Amount_Term" required>

    <label>Credit History</label>
    <select name="Credit_History" required>
        <option value="">Select</option>
        <option value="1">Good (1)</option>
        <option value="0">Bad (0)</option>
    </select>

    <label>Property Area</label>
    <select name="Property_Area" required>
        <option value="">Select</option>
        <option value="Urban">Urban</option>
        <option value="Semiurban">Semiurban</option>
        <option value="Rural">Rural</option>
    </select>

    <button type="submit">Predict Loan Status</button>

    {% if prediction %}
    <h2>{{ prediction }}</h2>
    {% endif %}
    
</form>
    </div>

</body>

</html>
